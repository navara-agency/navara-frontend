<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect to third-party origins used at page load -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-KVMRKK4B');</script>
    <!-- End Google Tag Manager -->

    <!-- Favicons — PNGs only. The .ico path was dropped because to-ico produced
         a corrupted multi-size ICO. Modern browsers use the PNG sizes natively. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/nv-icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/nv-icon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/nv-icon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/nv-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/nv-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/nv-apple-touch.png" />
    <meta name="theme-color" content="#001192" />

    <!-- Defaults only. Every public page renders <Seo /> (src/components/seo/Seo.jsx),
         which overwrites title/description/canonical/hreflang per route and locale,
         and the build-time prerenderer bakes those resolved tags into the shipped HTML.
         These values are the pre-hydration fallback, so they are Arabic to match the
         root locale. -->
    <title>وكالة تسويق رقمي متكاملة في مصر والسعودية | نافارا</title>
    <meta
      name="description"
      content="نافارا وكالة تسويق إلكتروني متكاملة تخدم مصر والسعودية: استراتيجية، إبداع، شراء إعلانات، وتحليلات تحت سقف واحد."
    />

    <!-- Open Graph (social link previews) -->
    <meta property="og:site_name" content="Navara" />
    <meta property="og:title" content="وكالة تسويق رقمي متكاملة في مصر والسعودية | نافارا" />
    <meta property="og:description" content="استراتيجية، إبداع، شراء إعلانات، وتحليلات تحت سقف واحد." />
    <meta property="og:image" content="https://navaraagency.com/og-image.png" />
    <meta property="og:url" content="https://navaraagency.com" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ProfessionalService rather than bare Organization: it is the type that
         carries service + locality signals, which is what this site competes on.
         NOTE: `sameAs` was removed because the previous values
         (linkedin.com/company/navara, instagram.com/navara) are not verifiably
         this company, and a wrong sameAs misattributes the brand entity.
         Add the real profile URLs here. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://navaraagency.com/#organization",
      "name": "Navara",
      "alternateName": ["Navara Agency", "نافارا"],
      "url": "https://navaraagency.com",
      "logo": "https://navaraagency.com/nv-icon-512.png",
      "image": "https://navaraagency.com/og-image.png",
      "description": "Integrated growth marketing agency serving Egypt and Saudi Arabia — strategy, creative, media buying and analytics under one roof.",
      "knowsLanguage": ["ar", "en"],
      "areaServed": [
        { "@type": "Country", "name": "Egypt", "identifier": "EG" },
        { "@type": "Country", "name": "Saudi Arabia", "identifier": "SA" }
      ],
      "serviceType": [
        "Growth marketing strategy",
        "Paid media buying",
        "Creative and content production",
        "Marketing analytics and conversion tracking"
      ]
    }
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KVMRKK4B"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
