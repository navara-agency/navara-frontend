<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect to third-party origins used at page load -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-KVMRKK4B');</script>
    <!-- End Google Tag Manager -->

    <!-- Favicons — PNGs only. The .ico path was dropped because to-ico produced
         a corrupted multi-size ICO. Modern browsers use the PNG sizes natively. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/nv-icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/nv-icon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/nv-icon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/nv-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/nv-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/nv-apple-touch.png" />
    <meta name="theme-color" content="#001192" />

    <!-- Deliberately no title, description, Open Graph or Twitter tags here.
         Every public page renders the Seo component (src/components/seo/Seo.jsx),
         which emits all of them per route and per locale. react-helmet-async
         appends its tags rather than replacing static ones, so declaring them
         in this shell produced two of each in every prerendered page — including
         English pages that carried an Arabic title. -->

    <!-- ProfessionalService rather than bare Organization: it is the type that
         carries service + locality signals, which is what this site competes on.
         `sameAs` points at the confirmed official profiles — this is what ties
         the domain to the brand entity, and is worth keeping accurate. The same
         URLs are in src/config/links.js, which the footer links use. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://navaraagency.com/#organization",
      "name": "Navara",
      "alternateName": ["Navara Agency", "نافارا"],
      "url": "https://navaraagency.com",
      "logo": "https://navaraagency.com/nv-icon-512.png",
      "image": "https://navaraagency.com/og-image.png",
      "description": "Integrated growth marketing agency serving Egypt and Saudi Arabia — strategy, creative, media buying and analytics under one roof.",
      "knowsLanguage": ["ar", "en"],
      "sameAs": [
        "https://www.linkedin.com/company/navara-agency/",
        "https://www.instagram.com/navara_agency/"
      ],
      "areaServed": [
        { "@type": "Country", "name": "Egypt", "identifier": "EG" },
        { "@type": "Country", "name": "Saudi Arabia", "identifier": "SA" }
      ],
      "serviceType": [
        "Growth marketing strategy",
        "Paid media buying",
        "Creative and content production",
        "Marketing analytics and conversion tracking"
      ]
    }
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KVMRKK4B"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
