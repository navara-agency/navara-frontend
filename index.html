    <!-- Favicons — PNGs only. The .ico path was dropped because to-ico produced

    <link rel="icon" type="image/png" sizes="32x32" href="/nv-icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/nv-icon-16.png" />

    <title>شركة تسويق الكتروني في السعودية ومصر | نافارا للتسويق الإلكتروني</title>
    <meta
      name="description"
      content="نافارا للتسويق الإلكتروني — وكالة تسويق رقمي متكاملة في السعودية ومصر. تصميم وبرمجة المواقع والمتاجر الإلكترونية، إدارة الإعلانات الممولة، وتحسين محركات البحث. اطلب استشارة مجانية."
    />

    <!-- Canonical + hreflang (root document). Per-route values are set by
         react-helmet-async once the app mounts. -->
    <link rel="canonical" href="https://navaraagency.com/" />
    <link rel="alternate" hreflang="ar" href="https://navaraagency.com/" />
    <link rel="alternate" hreflang="en" href="https://navaraagency.com/en/" />
    <link rel="alternate" hreflang="x-default" href="https://navaraagency.com/en/" />

    <!-- Open Graph (social link previews) -->
    <meta property="og:site_name" content="نافارا للتسويق الإلكتروني" />
    <meta property="og:title" content="شركة تسويق الكتروني في السعودية ومصر | نافارا" />
    <meta
      property="og:description"
      content="وكالة تسويق رقمي متكاملة في السعودية ومصر — استراتيجية، تصميم وبرمجة المواقع والمتاجر، إعلانات ممولة، وتحليلات تحت سقف واحد."
    />
    <meta property="og:image" content="https://navaraagency.com/og-image.png" />
    <meta property="og:url" content="https://navaraagency.com/" />

    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Schema.org organisation.
         alternateName carries the Arabic brand names. Without these Google has no
         signal tying "نافارا" to this domain, and every Arabic brand query resolves
         to the Nissan Navara pickup instead. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Navara",
      "alternateName": [
        "نافارا",
        "نافارا ايجنسي",
        "نافارا للتسويق الإلكتروني",
        "شركة نافارا للتسويق الإلكتروني",
        "Navara Agency"
      ],
      "url": "https://navaraagency.com",
      "logo": "https://navaraagency.com/nv-icon-512.png",
      "image": "https://navaraagency.com/og-image.png",
      "description": "نافارا وكالة تسويق إلكتروني متكاملة في السعودية ومصر — استراتيجية، تصميم وبرمجة المواقع والمتاجر الإلكترونية، إدارة الإعلانات الممولة، وتحليلات.",
      "foundingDate": "2026",
      "knowsLanguage": ["ar", "en"],
      "areaServed": [
        { "@type": "Country", "name": "SA" },
        { "@type": "Country", "name": "EG" }
      ],
      "sameAs": [
        "https://www.linkedin.com/company/navara-agency"
      ]
    }
    </script>
